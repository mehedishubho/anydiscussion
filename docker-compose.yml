# docker-compose.yml (repo root — D-19)
# Dev environment: Postgres 16 + MinIO (S3-compatible for R2 parity).
# Plans 02 and 03 consume these services independently in Wave 2.

services:
  # Primary dev database
  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: anydiscussion
      POSTGRES_PASSWORD: 125524
      POSTGRES_DB: anydiscussion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway DB for clean-room migration test (FOUND-06) — no volume (ephemeral)
  postgres-test:
    image: postgres:17-alpine
    ports:
      - "5438:5436"
    environment:
      POSTGRES_USER: anydiscussion
      POSTGRES_PASSWORD: 125524
      POSTGRES_DB: anydiscussion_test

  # MinIO — local S3-compatible storage (R2 parity for dev)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001" # MinIO console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # Redis — rate-limit counters (Plan 07-02 / PERF-04).
  # D-04 — 256mb cap, allkeys-lru eviction, NO persistence (rate-limit data is
  # ephemeral: a counter reset on restart just means a fresh 3/15min budget).
  # Dev port-mapping is for local parity only; in Coolify prod, Redis binds to
  # the internal network only (T-07-02-04 — NOT exposed publicly).
  # [CITED: RESEARCH.md Example 4 lines 676-720]
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru # D-04 — NOT noeviction
      - --save "" # disable RDB persistence (ephemeral data, D-04)
      - --appendonly no # disable AOF persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
